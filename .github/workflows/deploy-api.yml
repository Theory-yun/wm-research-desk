name: "중계 서버(실시간 시세·PB의 생각) 배포"

# worker/ 폴더가 바뀌거나 수동 실행하면 Cloudflare Workers에 배포합니다.
# 필요한 GitHub Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, GEMINI_API_KEY
# 배포 후 사이트가 쓸 주소를 data/api-config.json에 기록합니다.
on:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/deploy-api.yml"]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: wm-desk-data-commit
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: 비밀값 확인
        id: check
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          G: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$T" ] || [ -z "$A" ]; then
            echo "::notice title=배포 대기::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID 시크릿을 등록하면 배포됩니다(이번 실행은 건너뜀)"
            echo "ready=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
          [ -n "$G" ] || echo "::warning title=Gemini 키 없음::PB의 생각 반영 기능은 꺼진 상태로 배포됩니다"
          echo "시크릿 확인 완료"

      - name: Cloudflare Workers 배포
        if: steps.check.outputs.ready == 'true'
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy
          secrets: |
            GEMINI_API_KEY
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: 배포 주소 기록 및 동작 확인
        if: steps.check.outputs.ready == 'true'
        env:
          OUT: ${{ steps.deploy.outputs.command-output }}
          URL1: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          URL="$URL1"
          [ -n "$URL" ] || URL=$(echo "$OUT" | grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' | head -1)
          [ -n "$URL" ] || { echo "::error title=주소 확인 실패::배포 주소를 찾지 못했습니다. Cloudflare에서 workers.dev 하위 도메인을 먼저 등록해야 할 수 있습니다."; exit 1; }
          echo "배포 주소: $URL"
          sleep 5
          echo "== /health"; curl -s "$URL/health"; echo
          echo "== /quotes"; curl -s "$URL/quotes" | head -c 1500; echo
          echo "== /pb-rewrite (동작 확인 1회)"
          curl -s -X POST "$URL/pb-rewrite" -H "Origin: https://theory-yun.github.io" -H "Content-Type: application/json" \
            -d '{"pbView":"금리 정점 통과 가능성을 높게 보며 반도체 조정은 실적 확인 전 단기 변동으로 판단합니다.","file":"data/morning-latest.json"}' | head -c 2500; echo
          printf '{\n  "apiBase": "%s",\n  "deployedAt": "%s"\n}\n' "$URL" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > data/api-config.json
          cat data/api-config.json

      - name: 변경사항 커밋 & 푸시
        if: steps.check.outputs.ready == 'true'
        run: |
          bash scripts/ci/commit-push.sh "chore: 중계 서버 주소 갱신"
