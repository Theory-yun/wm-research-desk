name: "캘린더·F/O Insight 자동 갱신"

# 하루 두 번 실행합니다.
#  - KST 07:10 (UTC 22:10): 간밤 미국 일정(FOMC·CPI·고용) 결과 반영
#  - KST 17:40 (UTC 08:40): 당일 국내 일정(금통위·실적 공시) 결과 반영
on:
  schedule:
    - cron: "10 22 * * *"
    - cron: "40 8 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: wm-desk-data-commit
  cancel-in-progress: false

jobs:
  update-calendar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 실적 일정(DART) · 일정 결과 수집
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: node scripts/collect-calendar.mjs

      - name: F/O Insight 리포트 수집
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: node scripts/build-insights.mjs

      - name: 변경사항 커밋 & 푸시 (충돌 시 리베이스 재시도)
        run: |
          git config user.name "wm-desk-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --quiet --cached; then
            echo "변경 사항 없음 — 커밋 생략"
            exit 0
          fi
          git commit -m "chore(data): 캘린더·F/O Insight 자동 갱신 [$(date -u +'%Y-%m-%d %H:%M UTC')]"
          for i in 1 2 3 4 5; do
            if git push; then
              echo "push 성공 (시도 $i)"
              exit 0
            fi
            echo "push 실패 (시도 $i/5) — 원격 변경사항을 받아 리베이스 후 재시도합니다"
            git fetch origin main
            if ! git rebase origin/main; then
              echo "리베이스 충돌 — 자동 복구 불가, 다음 스케줄 실행에서 재시도됩니다"
              git rebase --abort
              exit 1
            fi
            sleep $((RANDOM % 8 + 3))
          done
          echo "5회 재시도 후에도 push 실패"
          exit 1
