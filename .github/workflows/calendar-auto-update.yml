name: "캘린더·F/O Insight 자동 갱신"

# 하루 두 번 실행합니다.
#  - KST 07:10 (UTC 22:10): 간밤 미국 일정(FOMC·CPI·고용) 결과 반영
#  - KST 17:40 (UTC 08:40): 당일 국내 일정(금통위·실적 공시) 결과 반영
on:
  schedule:
    - cron: "10 22 * * *"
    - cron: "40 8 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: wm-desk-data-commit
  cancel-in-progress: false

jobs:
  update-calendar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 실적 일정(DART) · 일정 결과 수집
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: node scripts/collect-calendar.mjs

      - name: F/O Insight 리포트 수집
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: node scripts/build-insights.mjs

      - name: 변경사항 커밋 & 푸시 (동시 실행 시 안전 재시도)
        run: bash scripts/ci/commit-push.sh "chore(data): 캘린더·F/O Insight 자동 갱신 [$(date -u +'%Y-%m-%d %H:%M UTC')]"
