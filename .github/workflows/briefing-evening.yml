name: "이브닝 브리핑 자동 수집 (국내 · 장 종료 후)"

# KST 16:05, 평일(KST 월~금)에 실행됩니다.
# 이 시각대는 UTC 07:05이며, 이때는 UTC 요일 = KST 요일이 동일하므로
# cron 요일은 그대로 "월(1)~금(5)"로 지정합니다. (모닝 워크플로와 요일 계산 방식이 다름에 주의)
on:
  schedule:
    - cron: "5 7 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: wm-desk-data-commit
  cancel-in-progress: false

jobs:
  build-evening:
    runs-on: ubuntu-latest
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 국내 이브닝 브리핑 데이터 생성 (시세 + 뉴스 + AI 요약)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
        run: node scripts/build-evening.mjs

      - name: 변경사항 커밋 & 푸시 (동시 실행 시 안전 재시도)
        run: bash scripts/ci/commit-push.sh "chore(data): 이브닝 브리핑 자동 갱신 [$(date -u +'%Y-%m-%d %H:%M UTC')]"
