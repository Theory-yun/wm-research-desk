name: "모닝 브리핑 자동 수집 (글로벌 · 장 개장 전)"

# KST 06:30, 평일(KST 월~금)에 실행됩니다.
# GitHub Actions cron은 UTC 기준이며, UTC 21:30은 다음날 KST 06:30이므로
# "KST 월~금"에 대응하는 UTC 요일은 "일(0)~목(4)"입니다. (하루 당겨짐에 주의)
on:
  schedule:
    - cron: "30 21 * * 0-4"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: wm-desk-data-commit
  cancel-in-progress: false

jobs:
  build-morning:
    runs-on: ubuntu-latest
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 글로벌 모닝 브리핑 데이터 생성 (시세 + 뉴스 + AI 요약)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
        run: node scripts/build-morning.mjs

      - name: F/O 리포트 아카이브 보강 (주 1회 또는 수동 실행 시)
        if: github.event.schedule == '30 21 * * 0' || github.event_name == 'workflow_dispatch'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/build-insights.mjs

      - name: 변경사항 커밋 & 푸시 (충돌 시 리베이스 재시도)
        run: |
          git config user.name "wm-desk-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --quiet --cached; then
            echo "변경 사항 없음 — 커밋 생략"
            exit 0
          fi
          git commit -m "chore(data): 모닝 브리핑 자동 갱신 [$(date -u +'%Y-%m-%d %H:%M UTC')]"
          for i in 1 2 3 4 5; do
            if git push; then
              echo "push 성공 (시도 $i)"
              exit 0
            fi
            echo "push 실패 (시도 $i/5) — 원격 변경사항을 받아 리베이스 후 재시도합니다"
            git fetch origin main
            if ! git rebase origin/main; then
              echo "리베이스 충돌 — 자동 복구 불가, 다음 스케줄 실행에서 재시도됩니다"
              git rebase --abort
              exit 1
            fi
            sleep $((RANDOM % 8 + 3))
          done
          echo "5회 재시도 후에도 push 실패"
          exit 1
